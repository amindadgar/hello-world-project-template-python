version: '3.8'

services:
  worker:
    build:
      context: .
      target: worker
    env_file:
      - .env
    environment:
      - TEMPORAL_HOST=${TEMPORAL_HOST}
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE}
      - TEMPORAL_TASK_QUEUE=${TEMPORAL_TASK_QUEUE}
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DATABASE=${MONGODB_DATABASE}
      - MONGODB_COLLECTION=${MONGODB_COLLECTION}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - AUTHORIZED_USER_ID=${AUTHORIZED_USER_ID}
      - SENTIMENT_API_ENABLED=${SENTIMENT_API_ENABLED}
      - LLM_RETRY_ATTEMPTS=${LLM_RETRY_ATTEMPTS}
      - LLM_RETRY_BACKOFF=${LLM_RETRY_BACKOFF}
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - .:/app
    working_dir: /app
    labels:
      - "ai-agent.service=worker"
    networks:
      - dokploy-network

  dashboard:
    build: .
    command: streamlit run streamlit_app.py --server.address ${STREAMLIT_HOST} --server.port ${STREAMLIT_PORT}
    env_file:
      - .env
    ports:
      - ${STREAMLIT_PORT}:${STREAMLIT_PORT}
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DATABASE=${MONGODB_DATABASE}
      - MONGODB_COLLECTION=${MONGODB_COLLECTION}
      - STREAMLIT_PASSWORD=${STREAMLIT_PASSWORD}
      - STREAMLIT_HOST=${STREAMLIT_HOST}
      - STREAMLIT_PORT=${STREAMLIT_PORT}
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - .:/app
    working_dir: /app
    labels:
      - "ai-agent.service=dashboard"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
